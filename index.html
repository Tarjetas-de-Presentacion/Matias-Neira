<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Javiera Neira Encina - Tarjeta Digital</title>
    <style>
        * { 
            box-sizing: border-box; 
            margin: 0; 
            padding: 0; 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; 
        }
        
        body { 
            background-color: #f5f5f7; 
            display: flex; 
            justify-content: center; 
            align-items: center; 
            height: 100vh; 
            height: 100dvh; 
            padding: 8px; 
            overflow: hidden; 
        }

        .container { 
            background: #ffffff; 
            width: 100%; 
            max-width: 380px; 
            max-height: 100dvh;
            border-radius: 20px; 
            overflow: hidden; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.08); 
            padding: 0 16px 14px 16px; 
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }
        
        /* Barra de 3 segmentos iguales (1/3 cada uno): Gris, Verde Oscuro, Verde Claro */
        .top-bar { display: flex; height: 4px; width: 100%; margin: 8px 0 10px 0; border-radius: 3px; overflow: hidden; flex-shrink: 0; }
        .bar-1 { background-color: #4A4A4A; flex: 1; } /* Gris Grafito */
        .bar-2 { background-color: #006B33; flex: 1; } /* Verde Oscuro */
        .bar-3 { background-color: #80B900; flex: 1; } /* Verde Claro */
        
        .card-header { background: #ffffff; border: 1px solid #e2e8f0; border-radius: 14px; padding: 12px 14px; position: relative; margin-bottom: 8px; }
        
        .logo-wrapper { display: flex; justify-content: flex-end; margin-bottom: 6px; }
        .logo-img { max-width: 110px; height: auto; display: block; object-fit: contain; }
        
        h1 { font-size: 1.2rem; color: #0f172a; font-weight: 700; margin-bottom: 2px; }
        .subtitle { font-size: 0.82rem; color: #334155; font-weight: 600; line-height: 1.2; margin-bottom: 4px; }
        .description { font-size: 0.72rem; color: #64748b; line-height: 1.2; margin-bottom: 8px; }
        
        .contact-info { display: flex; flex-direction: column; gap: 4px; font-size: 0.78rem; border-top: 1px solid #e2e8f0; padding-top: 8px; }
        .contact-info a { color: #334155; text-decoration: none; font-weight: 500; display: flex; align-items: center; gap: 6px; }
        .contact-icon { font-size: 0.85rem; opacity: 0.8; }
        
        .btn { display: flex; align-items: center; justify-content: center; gap: 6px; width: 100%; padding: 10px; border-radius: 10px; font-size: 0.85rem; font-weight: 600; text-decoration: none; margin-bottom: 6px; border: none; }
        .btn-main { background: #1e293b; color: #ffffff; }
        .btn-whatsapp { background: #25d366; color: #ffffff; }
        .grid-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin-bottom: 8px; }
        .btn-secondary { background: #f1f5f9; color: #1e293b; font-size: 0.78rem; padding: 8px; border: 1px solid #e2e8f0; margin-bottom: 0; }
        
        .qr-section { text-align: center; border-top: 1px solid #f1f5f9; padding-top: 8px; }
        .qr-title { font-size: 0.62rem; color: #64748b; letter-spacing: 1px; font-weight: 700; margin-bottom: 6px; }
        .qr-box { background: white; padding: 6px; border: 1px solid #e2e8f0; border-radius: 12px; display: inline-block; }
        .qr-box img { width: 95px; height: 95px; display: block; }
        .footer-text { font-size: 0.62rem; color: #94a3b8; margin-top: 4px; }
    </style>
</head>
<body>
    <div class="container">
        <div class="top-bar">
            <div class="bar-1"></div>
            <div class="bar-2"></div>
            <div class="bar-3"></div>
        </div>

        <div class="card-header">
            <div class="logo-wrapper">
                <img src="Logo BancoF.png" alt="Banco Falabella" class="logo-img">
            </div>

            <h1>Javiera Neira Encina</h1>

            <div class="description">Ingeniera Civil Industrial</div>
            
            <div class="contact-info">
                <a href="tel:+56966698926"><span class="contact-icon">📞</span> +56 9 6669 8926</a>
                <a href="mailto:jneiraen@bancofalabella.cl"><span class="contact-icon">✉️</span> jneiraen@bancofalabella.cl</a>
                <a href="https://www.bancofalabella.cl" target="_blank"><span class="contact-icon">🌐</span> www.bancofalabella.cl</a>
            </div>
        </div>

        <a href="javiera.vcf" download="Javiera_Neira.vcf" class="btn btn-main">📇 Guardar en Contactos</a>
        <a href="https://wa.me/56966698926" target="_blank" class="btn btn-whatsapp">💬 Mensaje por WhatsApp</a>

        <div class="grid-btns">
            <a href="mailto:jneiraen@bancofalabella.cl" class="btn btn-secondary">✉️ Correo</a>
            <a href="https://www.bancofalabella.cl" target="_blank" class="btn btn-secondary">🌐 Sitio Web</a>
           <a href="https://www.linkedin.com/in/javiera-neira-encina/" target="_blank" class="btn btn-secondary">🔗 LinkedIn</a>
            <a href="tel:+56966698926" class="btn btn-secondary">📞 Llamar</a>
        </div>

        <div class="qr-section">
            <div class="qr-title">ESCANEAR PARA COMPARTIR</div>
            <div class="qr-box">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=300x300&data=https://tarjetas-de-presentacion.github.io/Javiera-Neira/" alt="Código QR Javiera Neira">
            </div>
            <div class="footer-text">© bancofalabella.cl</div>
        </div>
    </div>
</body>
</html>
